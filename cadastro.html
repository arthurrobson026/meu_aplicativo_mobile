<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>S.O.S da Vovó - Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      /* Proporções de celular */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: #e7e7e7;
        display: flex;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .splash {
        width: 100%;
        max-width: 420px;
        min-height: 100vh;
        margin: 0 auto;
        background: #fff;
        position: relative;
        overflow-x: hidden;
      }

      @media (min-width: 480px) {
        body {
          padding: 24px 0;
        }
        .splash {
          min-height: 90vh;
          border-radius: 24px;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
        }
      }

      .splash-caixa {
        padding: 24px 20px;
      }
    </style>
  </head>
  <body>
    <section class="splash" id="pagina-cadastro" aria-label="Tela de cadastro">
      <div class="splash-caixa">
        <header class="splash-marca">
          <small>PROJETO</small>
          <h1>S.O.S da Vovó</h1>
        </header>

        <h2 class="splash-titulo">Criar sua conta</h2>

        <p class="splash-descricao">
          Cadastre-se para começar a usar o aplicativo e adicionar seus contatos
          de confiança.
        </p>

        <form id="formulario-cadastro">
          <div class="cartao area-campo">
            <label for="cadastro-nome">✎ Nome completo</label>
            <input
              class="campo-mensagem"
              id="cadastro-nome"
              name="nome"
              type="text"
              placeholder="Digite seu nome completo"
              autocomplete="name"
              required
            />
          </div>

          <div class="cartao area-campo">
            <label for="cadastro-email">✎ E-mail</label>
            <input
              class="campo-mensagem"
              id="cadastro-email"
              name="email"
              type="email"
              placeholder="seuemail@exemplo.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="cartao area-campo">
            <label for="cadastro-telefone">✎ Telefone</label>
            <input
              class="campo-mensagem"
              id="cadastro-telefone"
              name="telefone"
              type="tel"
              placeholder="(00) 00000-0000"
              autocomplete="tel"
              required
            />
          </div>

          <div class="cartao area-campo">
            <label for="cadastro-senha">✎ Senha</label>
            <input
              class="campo-mensagem"
              id="cadastro-senha"
              name="senha"
              type="password"
              placeholder="Crie uma senha"
              autocomplete="new-password"
              minlength="6"
              required
            />
          </div>

          <div class="cartao area-campo">
            <label for="cadastro-confirmar-senha">✎ Confirmar senha</label>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
